version: "3.9"

services:
  api:
    build:
      context: .
      target: api
    environment:
      PORT: "4000"
      NODE_ENV: "production"
      # 👉 Kết nối tới PostgreSQL RDS
      DATABASE_URL: postgres://postgres:postgres@database-1.c4vgei6uork9.us-east-1.rds.amazonaws.com:5432/postgres
    ports:
      - "4000:4000"
    restart: unless-stopped

  admin:
    build:
      context: .
      target: admin
      args:
        VITE_API_URL: http://api:4000/api
    depends_on:
      - api
    ports:
      - "5173:80"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_BASE_URL: http://api:4000/api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    depends_on:
      - api
    ports:
      - "5174:80"
    restart: unless-stopped
